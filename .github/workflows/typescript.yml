name: Test TypeScript
# Runs as an organization ruleset workflow ("Require workflows to pass before merging"), where
# only the workflow name is shown, not the job name, so the name must say what it checks. Rulesets
# ignore event filters and only run on the default activity types (opened, synchronize and reopened
# for pull requests, checks_requested for merge groups), so none are set here. A merge queue waits
# for every required workflow, so this one must also run on merge_group, where it checks the merged
# result.
#
# The check lives in _typescript.yml of actions-fyi/shared-workflows; see there. It checks the
# Node.js package at the repository's root: it installs the locked dependencies and runs the
# package's own typecheck, lint, format:check, build and test scripts. Rulesets ignore paths
# filters too, and a required workflow that never runs would block merging, so it runs in every
# repository the ruleset targets and passes where the root has no package.json. Pushes to main are
# checked by typescript.yml of actions-fyi/.github.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  typescript:
    name: TypeScript
    # What the jobs of _typescript.yml declare; a called job can't get more.
    permissions:
      contents: read # Read package.json and the lockfile, and check the package out
    uses: actions-fyi/shared-workflows/.github/workflows/_typescript.yml@v4.0.0
