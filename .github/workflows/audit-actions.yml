name: Audit GitHub Actions
# Runs as an organization ruleset workflow ("Require workflows to pass before merging"), where
# only the workflow name is shown, not the job name, so the name must say what it checks. Rulesets
# ignore event filters and only run on the default activity types (opened, synchronize and reopened
# for pull requests, checks_requested for merge groups), so none are set here. A merge queue waits
# for every required workflow, so this one must also run on merge_group, where it audits the merged
# result.
#
# The audit lives in _zizmor.yml of actions-fyi/shared-workflows; see there. Pushes to main are
# audited by zizmor.yml of actions-fyi/.github. Both callers use the job id zizmor, which is half of
# what code scanning keys an analysis on.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    # What the zizmor job of _zizmor.yml declares; a called job can't get more.
    permissions:
      security-events: write # Upload the SARIF results to code scanning
      contents: read # Check out the repository
      actions: read # Let upload-sarif read the workflow run
    uses: actions-fyi/shared-workflows/.github/workflows/_zizmor.yml@v0.15.1
