name: Claude Review
# Runs as an organization ruleset workflow ("Require workflows to pass before merging"), where
# only the workflow name is shown, not the job name, so the name must say what it checks. Rulesets
# ignore event filters and only run on the default activity types (opened, synchronize and reopened
# for pull requests, checks_requested for merge groups), so none are set here. A merge queue waits
# for every required workflow, so this one must also run on merge_group, where it reviews nothing:
# the pull request was reviewed before it was queued.
#
# The review lives in _claude-review.yml of actions-fyi/shared-workflows; see there. It is called
# by full path and tag, because in a ruleset workflow, GitHub resolves `$/` against the target
# repository. Prompt Guard screens the pull request's thread before Claude reads it, and a thread
# it can't screen fails the run, so every repository the ruleset targets needs the secrets below.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  review:
    name: Review
    # Not in a fork: Claude and Prompt Guard need the org's secrets, which a fork doesn't get.
    if: github.repository_owner == 'actions-fyi'
    # The union of what the jobs of _claude-review.yml declare; a called job can't get more.
    permissions:
      actions: read # Find the last reviewed commit from this workflow's earlier runs
      contents: read # Check out the pull request
      id-token: write # Log in to OpenBao for Prompt Guard
      issues: write # Read the comments, and comment on a flagged pull request
      pull-requests: write # Read the thread, flag it, and post review comments
    uses: actions-fyi/shared-workflows/.github/workflows/_claude-review.yml@v4.2.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROMPT_GUARD_CLIENT_ID: ${{ secrets.PROMPT_GUARD_CLIENT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
