name: CodeQL
# Runs as an organization ruleset workflow ("Require workflows to pass before merging"), where
# only the workflow name is shown, not the job name. Rulesets ignore event filters and only run on
# the default activity types (opened, synchronize and reopened for pull requests, checks_requested
# for merge groups), so none are set here. A merge queue waits for every required workflow, so this
# one must also run on merge_group.
#
# The analysis lives in _codeql.yml of actions-fyi/shared-workflows; see there. Pushes to main and
# the weekly run are analyzed by codeql.yml of actions-fyi/.github. Results are keyed on the
# category /language:<language>, which doesn't depend on the caller, so the two compare. CodeQL's
# default setup must be off in every repository this runs in, or code scanning rejects the upload.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  codeql:
    name: CodeQL
    # The union of what the jobs of _codeql.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the repository's languages and check it out
      security-events: write # Upload the results to code scanning
      actions: read # Let CodeQL read the workflow run
    uses: actions-fyi/shared-workflows/.github/workflows/_codeql.yml@e8b138d258347ce55279f3bf6f54f65a32b38ccc # v0.14.0
