name: Check Actions Lockfile
# Runs as an organization ruleset workflow ("Require workflows to pass before merging"), where
# only the workflow name is shown, not the job name, so the name must say what it checks. Rulesets
# ignore event filters and only run on the default activity types (opened, synchronize and reopened
# for pull requests, checks_requested for merge groups), so none are set here. A merge queue waits
# for every required workflow, so this one must also run on merge_group, where it verifies the
# merged result.
#
# The logic lives in _actions-lock.yml of actions-fyi/shared-workflows; see there. It is called by
# full path and tag, because in a ruleset workflow, GitHub resolves `$/` against the target
# repository. The name names the fix commit's trailer (Lockfile-Fixed-By).
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  actions-lock:
    name: Actions Lockfile
    # The union of what the jobs of _actions-lock.yml declare; a called job can't get more.
    permissions:
      contents: read # Compare the changes, read the workflows, check out the pull request
      id-token: write # Exchange the fix job's OIDC token with Octo STS
      pull-requests: write # Create or update the explanation comment
    uses: actions-fyi/shared-workflows/.github/workflows/_actions-lock.yml@v0.1.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
