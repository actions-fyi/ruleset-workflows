name: Lint GitHub Actions
# Runs as an organization ruleset workflow ("Require workflows to pass before merging"), where
# only the workflow name is shown, not the job name, so the name must say what it checks. Rulesets
# ignore event filters and only run on the default activity types (opened, synchronize and reopened
# for pull requests, checks_requested for merge groups), so none are set here. A merge queue waits
# for every required workflow, so this one must also run on merge_group, where it lints the merged
# result.
#
# Rulesets ignore paths filters too, and a required workflow that never runs would block merging.
# So the workflow always runs, and the changes job decides whether the pull request or merge group
# changes a workflow, an action, or the actionlint configuration. If not, the lint job is skipped,
# and the run still succeeds, because the changes job does.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  changes:
    name: Changed Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read # Compare the changes against the base
    outputs:
      lint: ${{ steps.changes.outputs.lint }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      # A three-dot compare lists what the pull request changes since it branched off; for a merge
      # group, the base is an ancestor of the head, so it lists everything the group adds. The API
      # lists at most 300 files, and a larger or unlistable change is linted rather than guessed.
      - name: Find Changed Workflows
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          lint() {
            echo "::notice::$1"
            echo "lint=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          compare="$RUNNER_TEMP/compare.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > "$compare" \
            || lint "The changed files couldn't be listed, so the workflows are linted."
          (( $(jq '.files // [] | length' "$compare") < 300 )) \
            || lint "Too many changed files to list, so the workflows are linted."
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/* | .github/actionlint.yaml | .github/actionlint.yml \
                | action.yml | action.yaml | */action.yml | */action.yaml)
                lint "$path changed, so the workflows are linted."
                ;;
            esac
          done < <(jq -r '.files // [] | .[] | .filename, (.previous_filename // empty)' "$compare")
          echo "::notice::No workflow, action or actionlint configuration changed. Nothing to lint."

  actions:
    name: GitHub Actions
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    # github.ref is refs/pull/<number>/merge for a pull request and a unique
    # refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha> for each merge group entry, so the two
    # never share a group.
    concurrency:
      group: actionslint-${{ github.ref }}
    permissions:
      contents: read # Read workflow files
      pull-requests: write # Post findings as review comments
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions Workflows
        uses: kjanat/actionlint@v1.17.1
        with:
          review: true
